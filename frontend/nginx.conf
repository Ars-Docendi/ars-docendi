# Config de nginx para servir el SPA de Ars Docendi (reemplaza el default.conf
# de la imagen). Solo sirve estáticos: el ruteo de /api lo hace Traefik hacia el
# backend del mismo ambiente (ver design.md, D5/D-front).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /api NO se sirve desde el frontend. Traefik lo rutea al backend con mayor
    # prioridad antes de llegar acá; este 404 explícito es defensa en profundidad
    # para que el contenedor nunca devuelva index.html ante /api.
    location /api {
        return 404;
    }

    # Fallback SPA: cualquier ruta de cliente desconocida devuelve index.html
    # para que react-router resuelva la vista en el navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
