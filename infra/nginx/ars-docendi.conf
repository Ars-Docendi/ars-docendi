# nginx config sample para Ars Docendi
#
# Este archivo es PLACEHOLDER. Cuando se reciba la VM y se defina dominio,
# adaptar las directivas marcadas como TBD.
#
# Asume:
#   - Backend Kestrel escuchando en 127.0.0.1:5000 (via systemd unit)
#   - Frontend buildeado servido como estáticos desde /var/www/ars-docendi
#   - TLS via Let's Encrypt (certbot)
#   - Dominio: TBD (ej. ars-docendi.unlam.edu.ar)

# Redirección HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name TBD.unlam.edu.ar;  # ajustar al dominio real

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;  # certbot challenge
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name TBD.unlam.edu.ar;  # ajustar al dominio real

    # TLS (paths gestionados por certbot)
    ssl_certificate     /etc/letsencrypt/live/TBD.unlam.edu.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TBD.unlam.edu.ar/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # HSTS (1 año, incluir subdominios si aplica)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security headers básicos
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Tamaño máximo de upload (ajustar según necesidad — ej. PDFs de planillas)
    client_max_body_size 10m;

    # Logs
    access_log /var/log/nginx/ars-docendi.access.log;
    error_log  /var/log/nginx/ars-docendi.error.log;

    # API → backend Kestrel
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
    }

    # Swagger (solo Dev / Staging — restringir o quitar en Prod)
    location /swagger {
        # allow <IP del depto>;
        # deny all;
        proxy_pass http://127.0.0.1:5000;
    }

    # Frontend estático
    root /var/www/ars-docendi;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo de assets versionados (Vite agrega hash)
    location ~* \.(js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
