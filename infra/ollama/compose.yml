# Instancia independiente. No añadir a los Compose projects de aplicación.
name: docendi-ai

services:
  ollama:
    image: ${OLLAMA_IMAGEN:?falta OLLAMA_IMAGEN fijada por digest}
    restart: unless-stopped
    init: true
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-4}
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-4096}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    volumes:
      - modelos:/root/.ollama
    networks:
      - inferencia
    # Sin ports: sólo Traefik en su red privada y la CLI local alcanzan Ollama.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    cpus: ${OLLAMA_LIMITE_CPU:-2}
    mem_limit: ${OLLAMA_LIMITE_MEMORIA:-8g}
    memswap_limit: ${OLLAMA_LIMITE_MEMORIA:-8g}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      traefik.enable: "true"
      # Override de la red pública por defecto del Docker provider existente.
      traefik.docker.network: ${OLLAMA_RED_TRAEFIK:-docendi-ai-inferencia}
      traefik.http.routers.ollama-privada.entrypoints: ollama
      traefik.http.routers.ollama-privada.rule: "(Method(`GET`) && (Path(`/api/version`) || Path(`/api/tags`))) || (Method(`POST`) && (Path(`/api/chat`) || Path(`/api/generate`)))"
      traefik.http.routers.ollama-privada.priority: "100"
      traefik.http.routers.ollama-privada.service: ollama-local
      traefik.http.routers.ollama-privada.middlewares: ollama-auth
      traefik.http.services.ollama-local.loadbalancer.server.port: "11434"
      traefik.http.services.ollama-local.loadbalancer.passhostheader: "false"
      # Streaming: flush inmediato, sin middleware Buffering ni Retry.
      traefik.http.services.ollama-local.loadbalancer.responseforwarding.flushinterval: "-1ms"
      traefik.http.middlewares.ollama-auth.basicauth.usersfile: /etc/traefik/ollama-auth/htpasswd
      traefik.http.middlewares.ollama-auth.basicauth.removeheader: "true"
      # Cambiar revisión tras rotar htpasswd fuerza reconstrucción del middleware.
      traefik.http.middlewares.ollama-auth.basicauth.realm: "Docendi IA privada r${OLLAMA_AUTH_REVISION:-1}"

networks:
  inferencia:
    # Operador la crea y conecta Traefik; down no borra la red compartida.
    external: true
    name: ${OLLAMA_RED_TRAEFIK:-docendi-ai-inferencia}

volumes:
  modelos:
    name: ${COMPOSE_PROJECT_NAME:-docendi-ai}-modelos
