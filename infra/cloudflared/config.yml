# Ingress del túnel de la VM Proxmox secundaria.
# Materializar el ID y el dominio fuera del repositorio; cloudflared no interpola
# variables de entorno en este archivo. Nunca guardar credenciales en Git.
tunnel: REEMPLAZAR_CON_TUNNEL_ID_SECUNDARIA
credentials-file: /etc/cloudflared/credentials.json

ingress:
  # Tras el corte a Debian, impedir que el wildcard vuelva a publicar prod.
  - hostname: prod.example.net
    service: http_status:404
  - hostname: staging.example.net
    service: http://traefik:80
  # Los previews se sirven directamente por el DNS wildcard de este túnel.
  - hostname: "*.example.net"
    service: http://traefik:80
  - service: http_status:404
