# Cloudflare Tunnel — UN solo ingress wildcard (D6).
#
# Todo el tráfico público entra por este túnel y se entrega a Traefik, que hace
# el routing fino por Host. Resultado: dar de alta prod/staging/pr-N NO requiere
# crear un public hostname por ambiente (explícitamente prohibido).
#
# `cloudflared` corre como su propio Compose project en el app host, unido a la
# red externa `traefik` para alcanzar al reverse proxy por nombre de servicio.
#
# Parametrización: cloudflared NO interpola variables de entorno en este archivo.
# El dominio real (decisión: se mantiene parametrizado fuera del repo) reemplaza
# a `example.net` ABAJO al desplegar; el runbook documenta el reemplazo. El ID
# del túnel y las credenciales se inyectan en runtime, nunca se commitean.

# ID o nombre del túnel. Se setea al crear el túnel (ver README.md).
tunnel: REEMPLAZAR_CON_TUNNEL_ID
# Credenciales del túnel inyectadas en runtime (montadas como secret), nunca al repo.
credentials-file: /etc/cloudflared/credentials.json

# Un único wildcard cubre prod (prod.<dominio>), staging (staging.<dominio>) y
# todos los pr-N (pr-<N>.<dominio>). Traefik resuelve cuál contenedor por Host.
ingress:
  - hostname: "*.example.net" # REEMPLAZAR example.net por el dominio real
    service: http://traefik:80
  # Catch-all obligatorio: cualquier host no manejado devuelve 404.
  - service: http_status:404
