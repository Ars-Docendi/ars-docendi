services:
  postgres:
    image: postgres:18-alpine
    container_name: arsdocendi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arsdocendi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-arsdocendi}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arsdocendi} -d ${POSTGRES_DB:-arsdocendi}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
