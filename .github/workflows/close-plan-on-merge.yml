name: Close plan on merge

# Cuando se mergea un PR a develop, este workflow detecta si el PR tocó un plan
# en docs/plans/active/ y, si sí, lo mueve a docs/plans/completed/ con frontmatter
# actualizado. Abre un PR de docs automático.

on:
  pull_request:
    types: [closed]
    branches: [develop]

jobs:
  close-plan:
    if: github.event.pull_request.merged == true
    name: Close plan if PR touched one
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Run close-plan-on-merge script
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec tsx scripts/close-plan-on-merge.ts
