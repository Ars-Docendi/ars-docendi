name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # Detecta qué partes del repo cambiaron para correr solo los jobs relevantes.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      openspec: ${{ steps.filter.outputs.openspec }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '!backend/**/*.md'
              - 'database/**'
              - '!database/**/*.md'
              - 'global.json'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
            docs:
              - 'docs/**'
              - '**/*.md'
            openspec:
              - 'openspec/**'

  # Format check siempre corre — chequea formato de TODOS los archivos versionados.
  format:
    name: Format check (prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Prettier check
        run: pnpm format:check

  # Valida las specs y changes de OpenSpec (fuente de verdad del planning).
  openspec:
    name: OpenSpec validate
    needs: changes
    if: needs.changes.outputs.openspec == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: package.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install deps
        run: pnpm install --frozen-lockfile
      - name: Validate changes and specs
        run: pnpm exec openspec validate --all --strict

  backend:
    name: Backend (.NET 10)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: "10.0.x"

      - name: Cache paquetes NuGet
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        continue-on-error: true
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ runner.arch }}-sdk-${{ hashFiles('global.json') }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-${{ runner.arch }}-sdk-

      - name: Restore
        run: dotnet restore ArsDocendi.slnx

      - name: Build
        run: dotnet build ArsDocendi.slnx --no-restore -c Release

      - name: Test
        run: dotnet test ArsDocendi.slnx --no-build -c Release --verbosity normal

      # El evaluador está FUERA del archivo de solución a propósito: adentro,
      # `dotnet test` lo correría y ejecutaría la API real decenas de veces por
      # semana. Ver backend/eval/README.md y el guard ExclusionDelEvaluadorTests.
      #
      # Compilarlo sí: build no llama a ningún proveedor y cuesta cero. Sin este
      # paso, el evaluador se rompería en silencio con cada cambio del núcleo y
      # nadie lo notaría hasta querer correrlo.
      #
      # NUNCA agregar `dotnet test` ni `dotnet run` sobre este proyecto.
      - name: Build del evaluador (sin correrlo)
        run: dotnet build eval/ArsDocendi.Evaluacion/ArsDocendi.Evaluacion.csproj -c Release

  frontend:
    name: Frontend (Vite + React)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: package.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter frontend lint

      - name: Build
        run: pnpm --filter frontend build

      - name: Test
        run: pnpm --filter frontend test:run
