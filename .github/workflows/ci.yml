name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  # Detecta qué partes del repo cambiaron para correr solo los jobs relevantes.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      docs: ${{ steps.filter.outputs.docs }}
      openspec: ${{ steps.filter.outputs.openspec }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
            docs:
              - 'docs/**'
              - '**/*.md'
            openspec:
              - 'openspec/**'

  # Format check siempre corre — chequea formato de TODOS los archivos versionados.
  format:
    name: Format check (prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Prettier check
        run: pnpm format:check

  # Valida las specs y changes de OpenSpec (fuente de verdad del planning).
  openspec:
    name: OpenSpec validate
    needs: changes
    if: needs.changes.outputs.openspec == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Validate changes and specs
        run: pnpm exec openspec validate --all --strict

  backend:
    name: Backend (.NET 10)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ArsDocendi.slnx

      - name: Build
        run: dotnet build ArsDocendi.slnx --no-restore -c Release

      - name: Test
        run: dotnet test ArsDocendi.slnx --no-build -c Release --verbosity normal

      # El evaluador está FUERA del archivo de solución a propósito: adentro,
      # `dotnet test` lo correría y ejecutaría la API real decenas de veces por
      # semana. Ver backend/eval/README.md y el guard ExclusionDelEvaluadorTests.
      #
      # Compilarlo sí: build no llama a ningún proveedor y cuesta cero. Sin este
      # paso, el evaluador se rompería en silencio con cada cambio del núcleo y
      # nadie lo notaría hasta querer correrlo.
      #
      # NUNCA agregar `dotnet test` ni `dotnet run` sobre este proyecto.
      - name: Build del evaluador (sin correrlo)
        run: dotnet build eval/ArsDocendi.Evaluacion/ArsDocendi.Evaluacion.csproj -c Release

  frontend:
    name: Frontend (Vite + React)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm --filter frontend lint

      - name: Build
        run: pnpm --filter frontend build

      # Test step pendiente: el frontend todavía no tiene runner configurado (Vitest/Jest).
      # Cuando se agregue, sumar:
      # - name: Test
      #   run: pnpm --filter frontend test
