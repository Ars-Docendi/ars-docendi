# Deploy de PROD desde la rama main (rama confiable → corre con secrets).
# Build de imágenes frontend+backend, tag por SHA, y spin-up del ambiente prod.
# No toca staging ni pr-N.
name: deploy-prod

on:
  push:
    branches: [main]
    # Solo redeploya cuando cambia el artefacto desplegable; cambios doc-only
    # (docs/**, openspec/**, *.md) no disparan deploy.
    paths:
      - "backend/**"
      - "!backend/**/*.md"
      - "frontend/**"
      - "!frontend/**/*.md"
      - "infra/**"
      - "!infra/**/*.md"
      - "database/**"
      - "!database/**/*.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push de imágenes a ghcr.io con GITHUB_TOKEN

jobs:
  deploy:
    runs-on: [self-hosted, arsdocendi, confiable]
    environment: prod
    env:
      AMBIENTE: prod
      TAG_FRONTEND: sha-${{ github.sha }}
      TAG_BACKEND: sha-${{ github.sha }}
      REGISTRO: ${{ vars.REGISTRO }}
      DOMINIO: ${{ vars.DOMINIO }}
      # Secrets inyectados en runtime (nunca horneados en imágenes).
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      APP_DB_USER: app_prod
      APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD_PROD }}
      ASPNETCORE_ENVIRONMENT: Production
      DEVELOPMENT_AUTHENTICATION_ENABLED: "false"
    steps:
      - uses: actions/checkout@v6

      - name: Login al registro de imágenes
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "${REGISTRO%%/*}" -u "${{ github.actor }}" --password-stdin

      - name: Build & push imágenes
        run: |
          docker build --build-arg VITE_DEVELOPMENT_AUTH_ENABLED=false -t "${REGISTRO}/arsdocendi-frontend:${TAG_FRONTEND}" frontend
          # Contexto en la raíz: el backend embebe el DDL de database/ como
          # recurso del assembly, así que es un input de compilación.
          docker build -t "${REGISTRO}/arsdocendi-backend:${TAG_BACKEND}" -f backend/Dockerfile .
          docker push "${REGISTRO}/arsdocendi-frontend:${TAG_FRONTEND}"
          docker push "${REGISTRO}/arsdocendi-backend:${TAG_BACKEND}"

      - name: Spin-up prod
        run: infra/scripts/spin-up.sh prod
