# Deploy manual de PRESENTACIÓN (presentacion.<DOMINIO>): el build de staging
# servido desde la PC principal, para que el asistente use Ollama por la red
# Docker local (como prod) en vez de pasar por el túnel ia.<DOMINIO>.
# Sin seed sintético (spin-up.sh lo omite). Usa los secrets del Environment staging.
name: deploy-presentacion

on:
  workflow_dispatch:

concurrency:
  group: deploy-presentacion
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    env:
      REGISTRO: ${{ vars.REGISTRO }}
      TAG_FRONTEND: sha-${{ github.sha }}
      TAG_BACKEND: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
        with:
          persist-credentials: false

      - name: Login al registro de imágenes
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login "${REGISTRO%%/*}" -u "${{ github.actor }}" --password-stdin

      - name: Build y push de imágenes inmutables
        run: |
          docker build --build-arg VITE_DEVELOPMENT_AUTH_ENABLED=true --build-arg VITE_MICROSOFT_LOGIN_ENABLED=true -t "${REGISTRO}/arsdocendi-frontend:${TAG_FRONTEND}" -f frontend/Dockerfile .
          # El backend embebe el DDL de database/; el contexto es la raíz.
          docker build -t "${REGISTRO}/arsdocendi-backend:${TAG_BACKEND}" -f backend/Dockerfile .
          docker push "${REGISTRO}/arsdocendi-frontend:${TAG_FRONTEND}"
          docker push "${REGISTRO}/arsdocendi-backend:${TAG_BACKEND}"

  deploy:
    needs: build
    name: presentacion / principal
    runs-on: [self-hosted, arsdocendi, confiable, principal]
    environment: staging
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      AMBIENTE: presentacion
      TAG_FRONTEND: sha-${{ github.sha }}
      TAG_BACKEND: sha-${{ github.sha }}
      REGISTRO: ${{ vars.REGISTRO }}
      DOMINIO: ${{ vars.DOMINIO }}
      BACKUP_VOLUME_PREFIX: ${{ vars.BACKUP_VOLUME_PREFIX }}
      BACKUP_RETENTION_DAYS: ${{ vars.BACKUP_RETENTION_DAYS }}
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      SEAWEEDFS_ROOT_ACCESS_KEY: ${{ secrets.SEAWEEDFS_ROOT_ACCESS_KEY }}
      SEAWEEDFS_ROOT_SECRET_KEY: ${{ secrets.SEAWEEDFS_ROOT_SECRET_KEY }}
      APP_DB_USER: app_presentacion
      APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD_STAGING }}
      ASISTENTE_RO_PASSWORD: ${{ secrets.ASISTENTE_RO_PASSWORD_STAGING }}
      ASISTENTE_RO_PII_PASSWORD: ${{ secrets.ASISTENTE_RO_PII_PASSWORD_STAGING }}
      # Ruta local por la red Docker `traefik`, como prod: sin túnel ni Service Token.
      ASISTENTE_PROVEEDOR: ollama
      INFERENCIA_URL: http://traefik:11435
      INFERENCIA_USUARIO: staging
      INFERENCIA_CONTRASENA: ${{ secrets.INFERENCIA_CONTRASENA_STAGING }}
      # Web Push (notificaciones al celular): sin las claves el push queda apagado.
      WEBPUSH_PUBLIC_KEY: ${{ vars.WEBPUSH_PUBLIC_KEY }}
      WEBPUSH_PRIVATE_KEY: ${{ secrets.WEBPUSH_PRIVATE_KEY }}
      WEBPUSH_SUBJECT: ${{ vars.WEBPUSH_SUBJECT }}
      ASPNETCORE_ENVIRONMENT: Staging
      DEVELOPMENT_AUTHENTICATION_ENABLED: "true"
      # Registración de staging (como los previews): https://presentacion.<DOMINIO>/api/auth/signin-oidc
      # se agrega a mano en ella; Microsoft no admite comodines.
      MICROSOFT_LOGIN_ENABLED: "true"
      MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID_STAGING }}
      MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET_STAGING }}
      # La base arranca vacía: crea el primer administrador si el secret existe (arranque --migrate).
      ADMIN_INICIAL_UPN: ${{ secrets.ADMIN_INICIAL_UPN }}
      ADMIN_INICIAL_NOMBRE: ${{ secrets.ADMIN_INICIAL_NOMBRE }}
      ADMIN_INICIAL_APELLIDO: ${{ secrets.ADMIN_INICIAL_APELLIDO }}
      ADMIN_INICIAL_DOCUMENTO: ${{ secrets.ADMIN_INICIAL_DOCUMENTO }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v4
        with:
          persist-credentials: false

      - name: Obtener el mismo SHA en este host
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login "${REGISTRO%%/*}" -u "${{ github.actor }}" --password-stdin
          docker pull "${REGISTRO}/arsdocendi-frontend:${TAG_FRONTEND}"
          docker pull "${REGISTRO}/arsdocendi-backend:${TAG_BACKEND}"

      - name: Spin-up presentacion en principal
        run: infra/scripts/spin-up.sh presentacion

      - name: Verificar contenedores e imágenes del SHA en este host
        run: |
          for servicio in frontend backend; do
            id="$(docker ps -q --filter "label=com.docker.compose.project=${AMBIENTE}" --filter "label=com.docker.compose.service=${servicio}")"
            if [[ -z "$id" ]]; then
              printf 'No hay contenedor %s en %s\n' "$servicio" "$AMBIENTE" >&2
              exit 1
            fi
            imagen="$(docker inspect --format '{{.Config.Image}}' "$id")"
            esperado="${REGISTRO}/arsdocendi-${servicio}:sha-${GITHUB_SHA}"
            if [[ "$imagen" != "$esperado" ]]; then
              printf 'Imagen inesperada para %s: %s\n' "$servicio" "$imagen" >&2
              exit 1
            fi
          done

      - name: Registrar destino y versión desplegada
        run: |
          printf 'Despliegue terminado: ambiente=%s destino=principal sha=%s\n' "$AMBIENTE" "$GITHUB_SHA"
